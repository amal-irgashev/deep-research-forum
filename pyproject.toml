[project]
name = "deep_researcher_agent"
version = "0.1.0"
description = "Deep researcher agent"
authors = [{name = "Amal Irgashev"}]
requires-python = ">=3.11,<3.14"
dependencies = [
"langgraph>=1.0.0",
"langgraph-cli[inmem]>=0.4.7",
"langchain>=1.0.0",
"langchain-openai>=1.0.0",
"langchain-anthropic>=1.0.0",
"langchain_community>=0.4",
"langchain_tavily>=0.2.12",
"langchain_mcp_adapters>=0.1.11",
"pydantic>=2.0.0",
"rich>=14.0.0",
"ipykernel>=6.20.0",
"tavily-python>=0.5.0",
"python-dotenv>=1.0.0",
"exa-py>=1.0.0",
"deepagents>=0.1.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deep_researcher_agent"]

[tool.setuptools.package-dir]
"deep_researcher_agent" = "src"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
